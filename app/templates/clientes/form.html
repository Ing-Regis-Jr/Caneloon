{% extends "base.html" %}

{% block title %}{{ titulo }} — {{ app_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ titulo }}</h1>
</div>

<div class="section-card" style="max-width: 480px;">
    <form method="POST">
        <div class="mb-4">
            <label for="nombre" class="form-label">Nombre del cliente</label>
            <input type="text" class="form-control form-control-lg" id="nombre" name="nombre"
                   value="{{ cliente.nombre if cliente else '' }}" required autofocus>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Guardar</button>
            <a href="{{ url_for('clientes.index') }}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
